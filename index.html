<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KUSK 游艺坊</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #eef2f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .lobby-container { max-width: 450px; width: 100%; background: #fff; border-radius: 24px; padding: 2.5rem 2rem; box-shadow: 0 10px 40px rgba(0,0,0,0.06); text-align: center; }
  h1 { font-size: 28px; font-weight: 800; color: #2c3e50; margin-bottom: 8px; }
  .subtitle { font-size: 14px; color: #95a5a6; margin-bottom: 2rem; }
  .game-list { display: flex; flex-direction: column; gap: 12px; }
  .game-card { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 16px; text-decoration: none; color: inherit; transition: all 0.2s ease; }
  .game-card:hover { transform: translateY(-2px); border-color: #29b6f6; background: #f1f9ff; box-shadow: 0 6px 15px rgba(41, 182, 246, 0.15); }
  .game-info { display: flex; align-items: center; gap: 14px; text-align: left; }
  .game-icon { font-size: 28px; }
  .game-name { font-size: 16px; font-weight: 700; color: #334155; }
  .game-desc { font-size: 12px; color: #64748b; margin-top: 2px; }
  .arrow { font-size: 16px; color: #cbd5e1; font-weight: 700; transition: transform 0.2s; }
  .game-card:hover .arrow { color: #29b6f6; transform: translateX(3px); }
  .footer { margin-top: 2.5rem; font-size: 11px; color: #cbd5e1; font-weight: 500; letter-spacing: 0.5px; }
</style>
</head>
<body>

<div class="lobby-container">
  <h1>🀄 KUSK 游艺坊</h1>
  <div class="subtitle">点击下方卡片 开启东方智慧与像素创意对决</div>
  
  <div class="game-list">
    <a href="./mahjong/" class="game-card">
      <div class="game-info">
        <span class="game-icon">🀄</span>
        <div>
          <div class="game-name">麻将连连看</div>
          <div class="game-desc">多人共享牌面 轮流消除争夺高分</div>
        </div>
      </div>
      <span class="arrow">➔</span>
    </a>

    <a href="./gomoku/" class="game-card">
      <div class="game-info">
        <span class="game-icon">⚫</span>
        <div>
          <div class="game-name">国风墨玉五子棋</div>
          <div class="game-desc">刀刻高清网格 智能人机与双人对抗</div>
        </div>
      </div>
      <span class="arrow">➔</span>
    </a>

    <a href="./beads/" class="game-card">
      <div class="game-info">
        <span class="game-icon">✨</span>
        <div>
          <div class="game-name">熨烫级像素拼豆工坊</div>
          <div class="game-desc">无缝密铺熔融质感 漫游缩放画布</div>
        </div>
      </div>
      <span class="arrow">➔</span>
    </a>
  </div>

  <div class="footer">GIT.KUSK.ASIA PORTAL</div>
</div>

</body>
</html>
